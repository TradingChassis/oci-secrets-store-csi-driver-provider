name: Unit Tests

# Reusable unit-test workflow for optional composition.
# Pull-request and branch validation live in ci.yaml (no Coveralls, no image push).
on:
  workflow_call: {}

jobs:
  build-binary-n-test:
    name: Build Binary locally and run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: build the binary
        run: |
          go build -mod vendor -o dist/provider ./cmd/server/main.go

      - name: Run Unit Tests
        run: |
          go test -covermode=count -coverprofile=profile.cov ./...
