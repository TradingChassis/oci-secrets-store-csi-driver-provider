name: Publish release image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tradingchassis/oci-secrets-store-csi-driver-provider
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish-release:
    name: Multi-arch versioned publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHA="${GITHUB_SHA}"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RAW_TAG="${GITHUB_REF_NAME}"

          if [[ ! "$RAW_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must match vX.Y.Z, got: $RAW_TAG"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          FULL="${MAJOR}.${MINOR}.${PATCH}"
          MINOR_TAG="${MAJOR}.${MINOR}"

          # Immutable tags must not be overwritten with a different image.
          for IMMUTABLE in "${FULL}" "${SHA}"; do
            if docker buildx imagetools inspect "${IMAGE}:${IMMUTABLE}" >/dev/null 2>&1; then
              echo "Immutable tag already exists: ${IMAGE}:${IMMUTABLE}"
              exit 1
            fi
          done

          {
            echo "image=${IMAGE}"
            echo "sha=${SHA}"
            echo "created=${CREATED}"
            echo "full=${FULL}"
            echo "minor=${MINOR_TAG}"
            echo "major=${MAJOR}"
            echo "tags<<EOF"
            echo "${IMAGE}:${FULL}"
            echo "${IMAGE}:${MINOR_TAG}"
            echo "${IMAGE}:${MAJOR}"
            echo "${IMAGE}:${SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch release image
        run: |
          docker buildx build \
            --platform=${{ env.PLATFORMS }} \
            --file build/Dockerfile \
            --build-arg VERSION=${{ steps.meta.outputs.full }} \
            --build-arg REVISION=${{ steps.meta.outputs.sha }} \
            --build-arg CREATED=${{ steps.meta.outputs.created }} \
            --provenance=false \
            --tag ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.full }} \
            --tag ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.minor }} \
            --tag ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.major }} \
            --tag ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }} \
            --push \
            .

      - name: Validate multi-arch manifest
        run: |
          docker buildx imagetools inspect ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.full }}
          docker buildx imagetools inspect ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}

      # GitHub Releases are intentionally not created automatically in this iteration.
      # Create releases manually after verifying the published image tags.
