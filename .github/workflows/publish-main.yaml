name: Publish main

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tradingchassis/oci-secrets-store-csi-driver-provider
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    name: Multi-arch publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          TAGS=("${IMAGE}:latest" "${IMAGE}:main")
          if docker buildx imagetools inspect "${IMAGE}:${SHA}" >/dev/null 2>&1; then
            echo "Immutable SHA tag already exists: ${IMAGE}:${SHA}"
            echo "Will refresh mutable tags latest/main only."
          else
            TAGS+=("${IMAGE}:${SHA}")
          fi

          {
            echo "image=${IMAGE}"
            echo "sha=${SHA}"
            echo "created=${CREATED}"
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        run: |
          TAG_ARGS=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            TAG_ARGS+=(--tag "$line")
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx build \
            --platform=${{ env.PLATFORMS }} \
            --file build/Dockerfile \
            --build-arg VERSION=main \
            --build-arg REVISION=${{ steps.meta.outputs.sha }} \
            --build-arg CREATED=${{ steps.meta.outputs.created }} \
            --provenance=false \
            "${TAG_ARGS[@]}" \
            --push \
            .

      - name: Validate multi-arch manifest
        run: |
          docker buildx imagetools inspect ${{ steps.meta.outputs.image }}:main
          docker buildx imagetools inspect ${{ steps.meta.outputs.image }}:latest
          if docker buildx imagetools inspect ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }} >/dev/null 2>&1; then
            docker buildx imagetools inspect ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          fi
