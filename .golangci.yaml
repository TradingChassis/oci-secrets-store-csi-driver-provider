version: "2"

# TradingChassis CI uses a focused set compatible with golangci-lint + Go 1.26.
# Style-only staticcheck checks (STxxxx / QFxxxx) are disabled to avoid failing on
# unchanged upstream code; correctness-oriented checks remain enabled.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-ST1023"
        - "-QF1001"
        - "-QF1002"
        - "-QF1003"
        - "-QF1004"
        - "-QF1005"
        - "-QF1006"
        - "-QF1007"
        - "-QF1008"
        - "-QF1009"
        - "-QF1010"
        - "-QF1011"
        - "-QF1012"

formatters:
  enable:
    - gofmt
